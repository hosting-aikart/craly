# Managed by the Craly deploy workflow (.github/workflows/deploy.yml).
# Do not edit on the server — change it here and push; the deploy installs it
# to /etc/nginx/conf.d/, which nginx includes inside the http {} block.
#
# Nginx's default request-body limit is 1 MB, so any upload over ~1 MB was
# rejected with "413 Request Entity Too Large" before it reached the API
# (and, lacking CORS headers, showed up in the browser as a CORS error).
# The API's own limit is 10 MB per file (multer, backend/src/utils/
# fileValidation.ts); 11m allows a 10 MB file plus multipart overhead.
# A server {} or location {} block that sets its own client_max_body_size
# takes precedence over this value.
client_max_body_size 11m;
