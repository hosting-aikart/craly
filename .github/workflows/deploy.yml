name: Deploy Craly Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::507941515127:role/CralyGitHubActionsSSMRole
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0378f04d73bab4a64
        run: |
          set -e

          cat > /tmp/deploy.sh <<'SCRIPT'
          set -Eeuo pipefail

          export HOME=/home/ec2-user
          export GIT_TERMINAL_PROMPT=0

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          nvm use 22 >/dev/null

          echo "Running deployment as: $(whoami)"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"

          cd /home/ec2-user/apps/craly

          echo "Configuring Git safe directory..."
          if ! git config --global --get-all safe.directory | grep -Fxq "/home/ec2-user/apps/craly"; then
            git config --global --add safe.directory /home/ec2-user/apps/craly
          fi

          echo "Fetching latest code..."
          timeout 120 git fetch origin main

          echo "Updating production checkout..."
          git reset --hard origin/main

          echo "Installing backend dependencies..."
          cd /home/ec2-user/apps/craly/backend
          timeout 600 npm ci

          echo "Building backend..."
          timeout 600 npm run build

          echo "Restarting API..."
          /usr/bin/pm2 restart craly-api --update-env

          echo "Restarting worker..."
          /usr/bin/pm2 restart craly-worker --update-env

          echo "Checking PM2 status..."
          /usr/bin/pm2 list

          echo "Checking API health..."
          sleep 5
          curl -fsS http://127.0.0.1:8080/health

          echo
          echo "Deployment successful."
          SCRIPT

          ENCODED_SCRIPT=$(base64 -w 0 /tmp/deploy.sh)

          cat > /tmp/ssm-commands.json <<JSON
          {
            "commands": [
              "printf '%s' '$ENCODED_SCRIPT' | base64 -d | sudo -iu ec2-user bash"
            ]
          }
          JSON

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment..."

          for i in {1..180}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            STATUS_DETAILS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StatusDetails' \
              --output text)

            echo "SSM status: $STATUS"
            echo "SSM status details: $STATUS_DETAILS"

            case "$STATUS" in

              Success)
                echo "Deployment command completed successfully."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment command failed."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "GitHub Actions polling timed out."
          echo "SSM command may still be running. Command ID: $COMMAND_ID"
          exit 1
