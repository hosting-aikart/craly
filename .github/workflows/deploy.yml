name: Deploy Craly Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::507941515127:role/CralyGitHubActionsSSMRole
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0378f04d73bab4a64
        run: |
          set -e

          cat > /tmp/ssm-commands.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /home/ec2-user/apps/craly",
               "echo 'Fetching latest code...'",
              "git -c safe.directory=/home/ec2-user/apps/craly fetch origin main",
              "echo 'Updating production checkout...'",
              "git reset --hard origin/main",
              "echo 'Installing backend dependencies...'",
              "cd backend",
              "npm ci",
              "echo 'Building backend...'",
              "NODE_OPTIONS=\"--max-old-space-size=1536\" npm run build",
              "echo 'Restarting API...'",
              "pm2 restart craly-api --update-env",
              "echo 'Restarting worker...'",
              "pm2 restart craly-worker --update-env",
              "echo 'Checking PM2 status...'",
              "pm2 list",
              "echo 'Checking API health...'",
              "sleep 5",
              "curl -fsS http://127.0.0.1:8080/health",
              "echo",
              "echo 'Deployment successful.'"
            ]
          }
          JSON

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment command completed successfully."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment command failed."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
