name: Deploy Craly Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# One production deploy at a time: two quick pushes must not run npm ci /
# build in the same EC2 checkout concurrently. A queued run waits.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::507941515127:role/CralyGitHubActionsSSMRole
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0378f04d73bab4a64
        run: |
          set -e

          cat > /tmp/deploy.sh <<'SCRIPT'
          set -Eeuo pipefail

          REPO="/home/ec2-user/apps/craly"
          BACKEND="$REPO/backend"

          echo "=== Git update ==="
          cd "$REPO"

          git -c safe.directory="$REPO" fetch origin main
          git -c safe.directory="$REPO" reset --hard origin/main

          echo "=== Fixing repository ownership ==="
          chown -R ec2-user:ec2-user "$REPO"

          # The API verifies RDS TLS against this CA bundle (src/db/index.ts).
          # It's gitignored, so it must already be on the instance; checking
          # here fails the deploy before the running API is restarted.
          echo "=== Checking RDS CA bundle ==="
          if [ ! -s "$BACKEND/global-bundle.pem" ]; then
            echo "ERROR: $BACKEND/global-bundle.pem is missing or empty."
            echo "Download https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem to that path."
            exit 1
          fi

          # Nginx request-body limit for uploads (deploy/nginx/). Validated with
          # nginx -t before reload and rolled back if invalid; a problem here is
          # reported but never blocks the API deploy.
          echo "=== Nginx upload limit ==="
          NGINX_SNIPPET_SRC="$REPO/deploy/nginx/craly-upload-limits.conf"
          NGINX_SNIPPET_DST="/etc/nginx/conf.d/craly-upload-limits.conf"
          if command -v nginx >/dev/null 2>&1 && [ -d /etc/nginx/conf.d ] && [ -f "$NGINX_SNIPPET_SRC" ]; then
            if cmp -s "$NGINX_SNIPPET_SRC" "$NGINX_SNIPPET_DST"; then
              echo "Nginx upload limit already current."
            else
              NGINX_BACKUP=""
              if [ -f "$NGINX_SNIPPET_DST" ]; then NGINX_BACKUP=$(mktemp); cp "$NGINX_SNIPPET_DST" "$NGINX_BACKUP"; fi
              install -m 644 "$NGINX_SNIPPET_SRC" "$NGINX_SNIPPET_DST"
              if nginx -t; then
                systemctl reload nginx && echo "Nginx reloaded with the new upload limit."
              else
                echo "WARNING: nginx -t failed with the new snippet; restoring the previous config."
                if [ -n "$NGINX_BACKUP" ]; then cp "$NGINX_BACKUP" "$NGINX_SNIPPET_DST"; else rm -f "$NGINX_SNIPPET_DST"; fi
                nginx -t || true
              fi
            fi
            echo "Effective client_max_body_size directives:"
            nginx -T 2>/dev/null | grep -n "client_max_body_size" || echo "(none)"
            # A 2 MB body must now reach Express (401: no auth), not stop at Nginx (413).
            head -c 2097152 /dev/zero > /tmp/craly-2mb.bin
            UPLOAD_PROBE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 \
              --resolve api.craly.co:443:127.0.0.1 -X POST \
              -H 'Content-Type: application/octet-stream' --data-binary @/tmp/craly-2mb.bin \
              https://api.craly.co/api/contractor-portal/documents || true)
            rm -f /tmp/craly-2mb.bin
            echo "2 MB upload probe through Nginx: HTTP ${UPLOAD_PROBE:-000} (expect 401; 413 = Nginx limit still too small)"
          else
            echo "Nginx or snippet not found; skipping."
          fi

          # Run as ec2-user WITHOUT sudo -i: -i backslash-escapes the command,
          # including newlines, which turns each multi-line block below into a
          # single silent no-op (exit 0) — npm ci/build/pm2 restart never ran.
          echo "=== Installing dependencies ==="
          sudo -u ec2-user -H bash -lc "
            set -e
            export HOME=/home/ec2-user
            export NVM_DIR=\$HOME/.nvm
            source \$NVM_DIR/nvm.sh
            nvm use 22 >/dev/null
            cd '$BACKEND'
            npm ci --no-audit --no-fund
          "

          echo "=== Building backend ==="
          sudo -u ec2-user -H bash -lc "
            set -e
            export HOME=/home/ec2-user
            export NVM_DIR=\$HOME/.nvm
            source \$NVM_DIR/nvm.sh
            nvm use 22 >/dev/null
            cd '$BACKEND'
            NODE_OPTIONS='--max-old-space-size=1536' npm run build
          "

          echo "=== Restarting API ==="
          sudo -u ec2-user -H bash -lc "
            set -e
            /usr/bin/pm2 restart craly-api --update-env
          "

          echo "=== Restarting worker ==="
          sudo -u ec2-user -H bash -lc "
            set -e
            /usr/bin/pm2 restart craly-worker --update-env
          "

          echo "=== PM2 status ==="
          sudo -u ec2-user -H bash -lc "
            /usr/bin/pm2 list
          "

          # Retry for up to ~60s (API start + first DB connection), and always
          # print the response body so a 503 shows *why* (e.g. the db error).
          echo "=== Health check ==="
          HEALTH_OK=0
          HTTP_CODE=000
          for attempt in $(seq 1 12); do
            sleep 5
            HTTP_CODE=$(curl -sS -o /tmp/craly-health.json -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              HEALTH_OK=1
              break
            fi
            echo "Health attempt $attempt/12: HTTP ${HTTP_CODE:-000}"
          done
          echo "Health response (HTTP ${HTTP_CODE:-000}):"
          cat /tmp/craly-health.json 2>/dev/null || true
          echo

          if [ "$HEALTH_OK" != "1" ]; then
            echo "=== HEALTH CHECK FAILED: recent craly-api logs ==="
            sudo -u ec2-user -H bash -lc "/usr/bin/pm2 logs craly-api --lines 60 --nostream" || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/health

          echo
          echo "=== DEPLOYMENT SUCCESSFUL ==="
          SCRIPT

          ENCODED_SCRIPT=$(base64 -w 0 /tmp/deploy.sh)

          # executionTimeout bounds the script on the instance (20 min), so a
          # stuck npm/build can't leave the deploy hanging indefinitely.
          cat > /tmp/ssm-commands.json <<JSON
          {
            "commands": [
              "printf '%s' '$ENCODED_SCRIPT' | base64 -d | bash"
            ],
            "executionTimeout": ["1200"]
          }
          JSON

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Craly deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment..."

          # SSM caps returned output (stdout 24,000 / stderr 8,000 chars).
          print_output() {
            echo "----- STDOUT -----"
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text || true
            echo "----- STDERR -----"
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || true
          }

          # 260 x 5s ≈ 21.5 min: just past the 20-min executionTimeout, so SSM
          # always reaches a final status before this loop gives up.
          for i in $(seq 1 260); do
            # Right after send-command the invocation may not exist yet
            # (InvocationDoesNotExist); treat that as Pending, don't abort.
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment command completed successfully."
                print_output
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                DETAILS=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StatusDetails' \
                  --output text 2>/dev/null || echo "unknown")
                echo "Deployment command failed: $STATUS ($DETAILS)."
                print_output
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "GitHub Actions polling timed out."
          echo "SSM Command ID: $COMMAND_ID"
          print_output
          exit 1
